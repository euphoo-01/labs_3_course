<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Fetch</title>
</head>

<body>

<h1>Fetch API</h1>

<p>
    Полученное от сервера имя:
    <span id="name">Загрузка...</span>
</p>

<script>

    fetch('/api/name')
        .then(response => response.text())
        .then(data => {

            document.getElementById('name').textContent = data;

        })
        .catch(error => {

            console.error('Ошибка:', error);

        });

</script>

</body>
</html>
