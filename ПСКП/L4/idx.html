<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>L4 EventEmitter</title>
</head>

<body>

<h1>Lab 04</h1>

<div>
    <label>ID:</label>
    <input id="id" type="number">
</div>

<br>

<div>
    <label>Name:</label>
    <input id="name" type="text">
</div>

<br>

<div>
    <label>Birthday:</label>
    <input id="bday" type="date">
</div>

<br>

<button onclick="sendRequest('GET')">
    GET
</button>

<button onclick="sendRequest('POST')">
    POST
</button>

<button onclick="sendRequest('PUT')">
    PUT
</button>

<button onclick="sendRequest('DELETE')">
    DELETE
</button>

<h2>Result</h2>

<pre id="result"></pre>

<script>

async function sendRequest(method) {

    var requestUrl = '/api/db';

    var options = {
        method: method
    };

    if (method === 'POST' || method === 'PUT') {

        options.headers = {
            'Content-Type': 'application/json'
        };

        options.body = JSON.stringify({
            id: Number(document.getElementById('id').value),
            name: document.getElementById('name').value,
            bday: document.getElementById('bday').value
        });
    }

    if (method === 'DELETE') {

        var id = document.getElementById('id').value;

        requestUrl += '?id=' + id;
    }

    var response = await fetch(requestUrl, options);

    var data = await response.json();

    document.getElementById('result').textContent =
        JSON.stringify(data, null, 2);
}

</script>

</body>
</html>
